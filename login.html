<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Nufaika International</title>
</head>
<body style="font-family:Arial; background:#0e4d27; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
<div style="background:white; padding:30px; border-radius:15px; width:90%; max-width:350px; text-align:center;">
<h2 style="color:#0e4d27;">Nufaika International</h2>
<p>EST 2026 • Staff Login</p>
<input id="user" placeholder="Username" style="width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc;"><br>
<input id="pass" type="password" placeholder="Password" style="width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc;"><br>
<button onclick="login()" style="background:#0e4d27; color:white; padding:12px; width:95%; border:none; border-radius:8px; margin-top:10px;">Login</button>
<p id="err" style="color:red; display:none;">Wrong username or password</p>
</div>
<script>
function login(){
  const u=document.getElementById('user').value;
  const p=document.getElementById('pass').value;
  // Change these to your real login
  if(u==="Antony" && p==="Nufaika2026"){
    localStorage.setItem("nufaika_logged","yes");
    window.location.href="index.html";
  } else {
    document.getElementById('err').style.display='block';
  }
}
</script>
</body>
</html>
