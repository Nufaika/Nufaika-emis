
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nufaika International</title>
</head>
<body style="font-family:Arial; background:#f5f7f2; margin:0; padding:20px;">
  <script>if(localStorage.getItem("nufaika_logged")!=="yes"){window.location.href="login.html";}</script>
<div style="text-align:center; background:#fff; padding:30px; border-radius:15px; max-width:800px; margin:0 auto; box-shadow:0 4px 15px rgba(0,0,0,0.1)">

<img src="nufaika-logo.png" alt="Nufaika Logo" style="width:200px; margin:0 auto; display:block" onerror="this.style.display='none'">

<h1 id="greet" style="color:#0e4d27; margin-top:20px;">Welcome, Antony!</h1>
<p id="date"></p>

<div style="background:linear-gradient(135deg,#f0f9e8,#fef9e0); padding:20px; border-radius:12px; margin-top:20px;">
<h3 id="quote" style="color:#0e4d27;"></h3>
<small>At Nufaika International, every small step fuels lasting change.</small><br>
<small style="color:#b8962e; font-weight:bold;">EST 2026 • Empowering Microfinance</small>
</div>

<div style="margin-top:25px; display:grid; grid-template-columns:1fr 1fr; gap:15px;">
<a href="members.html" style="background:#0e4d27; color:#fff; padding:15px; border-radius:10px; text-decoration:none;">Members</a>
<a href="loans.html" style="background:#b8962e; color:#fff; padding:15px; border-radius:10px; text-decoration:none;">Loans</a>
<a href="repayments.html" style="background:#fff; color:#0e4d27; border:2px solid #0e4d27; padding:15px; border-radius:10px; text-decoration:none;">Collections</a>
<a href="reports.html" style="background:#fff; color:#0e4d27; border:2px solid #b8962e; padding:15px; border-radius:10px; text-decoration:none;">Reports</a>
</div>

</div>

<script>
const hour = new Date().getHours();
let g = "Welcome";
if(hour<12) g="Good Morning"; else if(hour<17) g="Good Afternoon"; else if(hour<21) g="Good Evening"; else g="Good Night";
document.getElementById("greet").innerHTML = g + ", Antony!";
document.getElementById("date").innerHTML = new Date().toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + " • Ready to drive growth today.";
const quotes=["Planting hope, nurturing progress, growing futures.","Small steps today, thriving businesses tomorrow.","Empowering dreams, one business at a time.","Growth is not by chance, but by choice and commitment.","Together we rise — Nufaika, building brighter tomorrows."];
document.getElementById("quote").innerHTML = quotes[Math.floor(Math.random()*quotes.length)];
</script>

</body>
</html>
